version: '3.8'

services:
  # PostgreSQL Database with pgvector (Production)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: humanwriter-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - humanwriter-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: humanwriter-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - humanwriter-network-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ChromaDB (Production)
  chromadb:
    image: chromadb/chroma:latest
    container_name: humanwriter-chromadb-prod
    ports:
      - "8000:8000"
    volumes:
      - chroma_data_prod:/chroma/chroma
    environment:
      - ALLOW_RESET=false
      - ANONYMIZED_TELEMETRY=false
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN}
    networks:
      - humanwriter-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # AI Engine (Production)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
      target: production
    container_name: humanwriter-ai-engine-prod
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}  # RunPod GPU endpoint in production
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - CHROMADB_AUTH_TOKEN=${CHROMA_AUTH_TOKEN}
      - POSTGRES_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MODEL_NAME=${MODEL_NAME}
      - LOG_LEVEL=info
      - WORKERS=4
    volumes:
      - ./ai-engine/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - humanwriter-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
      replicas: 2  # High availability

  # Backend API (Production)
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
      target: production
    container_name: humanwriter-backend-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - AI_ENGINE_URL=http://ai-engine:8001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    volumes:
      - backend_uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - humanwriter-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
      replicas: 2  # Load balancing

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: humanwriter-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend-api
      - ai-engine
    networks:
      - humanwriter-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Monitoring: Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: humanwriter-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - humanwriter-network-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

  # Monitoring: Grafana (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: humanwriter-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource
    networks:
      - humanwriter-network-prod
    restart: always
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  humanwriter-network-prod:
    driver: bridge
    name: humanwriter-network-prod

volumes:
  postgres_data_prod:
    name: humanwriter-postgres-data-prod
  redis_data_prod:
    name: humanwriter-redis-data-prod
  chroma_data_prod:
    name: humanwriter-chroma-data-prod
  backend_uploads_prod:
    name: humanwriter-backend-uploads-prod
  nginx_cache:
    name: humanwriter-nginx-cache
  prometheus_data:
    name: humanwriter-prometheus-data
  grafana_data:
    name: humanwriter-grafana-data
