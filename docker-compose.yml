version: '3.8'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: humanwriter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanwriter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-humanwriter_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humanwriter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: humanwriter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # ChromaDB
  chromadb:
    image: chromadb/chroma:latest
    container_name: humanwriter-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Engine (FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
      target: development
    container_name: humanwriter-ai-engine
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - REDIS_URL=redis://redis:6379
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./ai-engine/src:/app/src
      - ./ai-engine/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - humanwriter-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Backend API (Express)
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
      target: development
    container_name: humanwriter-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:8001
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-this}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend-api/src:/app/src
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - humanwriter-network
    restart: unless-stopped

  # Frontend (Next.js)
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: development
    container_name: humanwriter-webapp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-generate-with-openssl-rand}
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:3001}
    volumes:
      - ./webapp/src:/app/src
      - ./webapp/public:/app/public
      - webapp_node_modules:/app/node_modules
      - webapp_next:/app/.next
    depends_on:
      - postgres
      - backend-api
    networks:
      - humanwriter-network
    restart: unless-stopped

networks:
  humanwriter-network:
    driver: bridge
    name: humanwriter-network

volumes:
  postgres_data:
    name: humanwriter-postgres-data
  redis_data:
    name: humanwriter-redis-data
  chroma_data:
    name: humanwriter-chroma-data
  backend_uploads:
    name: humanwriter-backend-uploads
  webapp_node_modules:
    name: humanwriter-webapp-node-modules
  webapp_next:
    name: humanwriter-webapp-next
