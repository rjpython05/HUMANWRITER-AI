version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: humanwriter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-humanwriter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-humanwriter_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-humanwriter}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: humanwriter-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: humanwriter-chromadb
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - ANONYMIZED_TELEMETRY=false
    networks:
      - humanwriter-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # AI Engine (Python FastAPI)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: humanwriter-ai-engine
    ports:
      - "${AI_ENGINE_PORT:-8001}:8001"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - REDIS_URL=redis://redis:6379
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./ai-engine/models:/app/models
      - ./ai-engine/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - humanwriter-network
    restart: unless-stopped
    # Note: Ollama runs on host machine, not in Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Backend API Gateway (Node.js + Express)
  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: humanwriter-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - REDIS_URL=redis://redis:6379
      - AI_ENGINE_URL=http://ai-engine:8001
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-this}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend-api/uploads:/app/uploads
      - ./backend-api/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_started
    networks:
      - humanwriter-network
    restart: unless-stopped

  # Frontend Web Application (Next.js 14)
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
      target: development
    container_name: humanwriter-webapp
    ports:
      - "${WEBAPP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - API_URL=http://backend-api:3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - ./webapp/src:/app/src
      - ./webapp/public:/app/public
      - ./webapp/.next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    networks:
      - humanwriter-network
    restart: unless-stopped

  # Scraper Service (Node.js + Puppeteer)
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: humanwriter-scraper
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-humanwriter}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-humanwriter_db}
      - DATA_DIR=/app/data
      - MAX_CONCURRENT_SCRAPERS=${SCRAPER_MAX_CONCURRENT:-5}
      - RATE_LIMIT_MS=${SCRAPER_RATE_LIMIT_MS:-2000}
      - MAX_RETRIES=${SCRAPER_MAX_RETRIES:-3}
    volumes:
      - ./scraper/data:/app/data
      - ./scraper/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - humanwriter-network
    restart: "no"  # Run on-demand only
    profiles:
      - scraper  # Only start when explicitly requested

networks:
  humanwriter-network:
    driver: bridge
    name: humanwriter-network

volumes:
  postgres_data:
    name: humanwriter-postgres-data
  redis_data:
    name: humanwriter-redis-data
  chroma_data:
    name: humanwriter-chroma-data
