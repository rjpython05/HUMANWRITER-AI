[tool.poetry]
name = "humanwriter-ai-engine"
version = "1.0.0"
description = "HumanWriter AI - AI Engine with FastAPI"
authors = ["HumanWriter AI Team"]

[tool.poetry.dependencies]
python = "^3.11"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
